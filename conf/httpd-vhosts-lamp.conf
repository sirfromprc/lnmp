# LAMP 架构的默认虚拟主机（Apache 直接对外监听 80 端口）。
# Apache 使用首个 VirtualHost 处理未匹配域名和直接 IP 请求。
# 用户站点由 lnmp vhost add 写入 conf/vhost/；修改后运行 apachectl -S 和 apachectl -t。
# 文档：https://httpd.apache.org/docs/2.4/vhosts/
#
<VirtualHost *:80>
ServerAdmin webmaster@example.com
# open_basedir 限制 PHP 文件访问范围；默认站点保持静态，phpMyAdmin 使用独立 Alias。
#php_admin_value open_basedir "/home/wwwroot/default:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/default"
# 默认站点由配置顺序决定，真实域名写入 conf/vhost/ 的站点配置。
ServerName _
ErrorLog "/home/wwwlogs/default.error.log"
CustomLog "/home/wwwlogs/default.log" combined
<Directory "/home/wwwroot/default">
    # 仅跟随链接与目标属主一致的符号链接，不启用目录列表。
    Options SymLinksIfOwnerMatch
    # 默认静态站点不读取 .htaccess，动态站点可单独配置。
    AllowOverride None
    # Apache 2.4 的访问控制语法（2.2 的 Order/Allow 已废弃）。
    Require all granted
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    # 仅允许三个可选演示页执行 PHP；未部署时请求返回 404。
    <FilesMatch "^(phpinfo|redis|memcached)\.php$">
        Require all granted
    </FilesMatch>
    DirectoryIndex index.html
</Directory>
</VirtualHost>
