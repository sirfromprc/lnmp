# Apache 的 HTTPS 全局配置（LAMP 架构使用；LNMPA 架构下 TLS 由前端 nginx 终结，
# 不会加载本文件）。
# 具体站点的证书路径写在 conf/vhost/<域名>.conf 里，本文件只放全局参数。
# 修改后运行 apachectl -t，并用 openssl s_client 验证 TLS 1.2 和 1.3。

Listen 443

# 让浏览器下载 .crt / .crl 时能识别类型（分发 CA 证书、吊销列表用）。
AddType application/x-x509-ca-cert .crt
AddType application/x-pkcs7-crl .crl

# TLS 1.0/1.1 已由 RFC 8996 弃用，仅启用 TLS 1.2/1.3。
SSLProtocol -all +TLSv1.2 +TLSv1.3

# TLS 1.2 仅使用带前向保密的 AEAD 套件，排除 3DES、静态 RSA 和 CBC。
# TLS 1.3 使用 OpenSSL 默认的独立 AEAD 套件。
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# 允许客户端在安全套件列表中选择其硬件支持更好的算法。
SSLHonorCipherOrder off

# mod_proxy 连接 HTTPS 后端时使用相同协议下限。
SSLProxyProtocol -all +TLSv1.2 +TLSv1.3
SSLProxyCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# 无人值守启动需使用无口令私钥，并以 root:root 600 权限保护。
SSLPassPhraseDialog builtin

# 服务端缓存已完成的握手，减少重复连接延迟。
SSLSessionCache "shmcb:/usr/local/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# 关闭长期 ticket 密钥带来的历史流量解密风险，改用服务端会话缓存。
SSLSessionTickets off

# Let's Encrypt 新证书不再提供 OCSP URI，因此默认不启用 Stapling。
# 使用仍提供 OCSP 的 CA 时可按需启用：
#   SSLUseStapling on
#   SSLStaplingCache "shmcb:/usr/local/apache/logs/ssl_stapling(32768)"
#   SSLStaplingReturnResponderErrors off

# 拒绝无 SNI 请求，避免域名虚拟主机返回错误证书。
SSLStrictSNIVHostCheck on

# HTTP/2 仅在 TLS 1.2 以上及 AEAD 套件下启用。
H2ModernTLSOnly on
