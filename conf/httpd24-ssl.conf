#
# Apache 的 HTTPS 全局配置（LAMP 架构使用；LNMPA 架构下 TLS 由前端 nginx 终结，
# 不会加载本文件）。
#
# 具体站点的证书路径写在 conf/vhost/<域名>.conf 里，本文件只放全局参数。
# 修改后必须先执行 apachectl -t 检查语法，再用
#   openssl s_client -connect <域名>:443 -tls1_2   / -tls1_3
# 确认实际协商结果。
#

Listen 443

# 让浏览器下载 .crt / .crl 时能识别类型（分发 CA 证书、吊销列表用）。
AddType application/x-x509-ca-cert .crt
AddType application/x-pkcs7-crl .crl

# --- 协议版本 ---
#
# 只保留 TLS 1.2 和 1.3。TLS 1.0 / 1.1 已被 RFC 8996 正式弃用，
# 主流浏览器从 2020 年起就不再连接，PCI-DSS 也明确禁止。
# 先 -all 全部关掉再逐个打开，避免以后 OpenSSL 加了新协议时被默认带上。
#
# 极少数老设备（Windows XP、Android 4.x、老式打印机/POS）只支持 TLS 1.0，
# 确实要迁就它们就在后面加 +TLSv1，但要清楚这等于对所有访客降低了安全下限。
SSLProtocol -all +TLSv1.2 +TLSv1.3

# --- 加密套件（TLS 1.2）---
#
# 只保留带 ECDHE/DHE 的前向保密套件和 AEAD 算法（GCM、CHACHA20-POLY1305）。
# 特意排除的三类：
#   - 3DES：Sweet32 攻击（CVE-2016-2183）
#   - 静态 RSA 密钥交换（形如 AES128-SHA）：没有前向保密，
#     私钥一旦泄露，历史流量可被全部解密
#   - CBC 模式：Lucky13 一类的填充攻击一直在出新变种
#
# TLS 1.3 套件不在此处配置；它使用独立的命名空间（Apache 用
# "SSLCipherSuite TLSv1.3 ..." 单独指定）。OpenSSL 的 TLS 1.3 默认套件
# 本身就只有三个 AEAD 算法，无需调整，故不写。
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# off = 由客户端决定用哪个套件。上面的清单里每一个都是安全的，
# 此时由客户端选择套件，以便使用其支持硬件加速的算法，
# 服务器强推 AES-GCM 反而更慢更费电。
SSLHonorCipherOrder off

# --- Apache 作为 HTTPS 客户端时（mod_proxy 反代到 https 后端）---
# 与上面保持同一标准。若从未反代过 https 后端，这两行不会生效。
SSLProxyProtocol -all +TLSv1.2 +TLSv1.3
SSLProxyCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# builtin = 私钥带口令时，在终端上提示输入。
# 这意味着加密的私钥会让 Apache 无法开机自启（没人在终端上敲口令）。
# 服务器上的证书私钥应当不加密，靠文件权限（600、属主 root）保护。
SSLPassPhraseDialog builtin

# --- 会话复用 ---
#
# 缓存已完成的握手，回头客可以跳过完整握手直接恢复会话，明显降低延迟。
SSLSessionCache "shmcb:/usr/local/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# off = 关闭 TLS session ticket。
# ticket 把会话密钥加密后交给客户端保管，而加密它的那把密钥在 Apache 里
# 长期不变（除非重启），一旦泄露，此前录下的流量可被批量解密 ：
# 等于抵消了上面精心挑选的前向保密套件。会话复用改由上面的服务端缓存承担。
SSLSessionTickets off

# --- 关于 OCSP Stapling ---
#
# 本文件不开启 SSLUseStapling。
#
# Let's Encrypt 已经退出 OCSP：新签发的证书里不再包含 OCSP 响应端地址，
# 响应端本身也已停止服务，吊销状态改由 CRL 承担。本项目默认签发的就是
# Let's Encrypt 证书，开了 stapling 也没有响应端可查，只会在错误日志里
# 反复留下 "no OCSP URI in certificate" 一类的记录。
#
# 若换用了仍在提供 OCSP 的商业 CA，再按需加上这三行：
#   SSLUseStapling on
#   SSLStaplingCache "shmcb:/usr/local/apache/logs/ssl_stapling(32768)"
#   SSLStaplingReturnResponderErrors off

# on = 客户端不发 SNI 就拒绝服务。
# 基于域名的 HTTPS 虚拟主机必须靠 SNI 才能选对证书，
# 不发 SNI 的客户端拿到的一定是第一个虚拟主机的证书，不如直接拒绝。
SSLStrictSNIVHostCheck on

# on = HTTP/2 只在满足现代 TLS 要求（TLS 1.2 以上、AEAD 套件）时启用。
# 上面的协议和套件配置本来就满足，开着它可以防止日后有人放宽配置时
# 悄悄退化成不安全的 HTTP/2 连接。
H2ModernTLSOnly on
