#
# LNMPA 架构的默认虚拟主机。
#
# 与 LAMP 的区别：Apache 不直接对外，只在 127.0.0.1:88 上听，
# 由前端 nginx 把 PHP 请求反代过来（见 conf/proxy-pass-php.conf）。
# 端口 88 不需要、也不应该在防火墙上放行。
#
# 本文件只放默认站点，也就是所有没被具体域名认领的请求的兜底去处 ：
# Apache 把配置里出现的第一个 <VirtualHost> 当默认站点。
# 用 lnmp vhost add 添加的站点会各自生成一个文件放进 conf/vhost/，
# 由 httpd.conf 末尾的 IncludeOptional 加载，不要往本文件里加。
#
# 改完用 apachectl -S 检查虚拟主机的匹配顺序，用 apachectl -t 检查语法。
# 文档：https://httpd.apache.org/docs/2.4/vhosts/
#
<VirtualHost *:88>
ServerAdmin webmaster@example.com
# 限制 PHP 只能读写这几个目录，防止一个站点被拿下后横向读取其它站点的文件。
# 注意 open_basedir 一旦开启，PHP 连 include 路径都受限，
# 少写一个目录就会出现「莫名其妙的 file not found」。
#php_admin_value open_basedir "/home/wwwroot/default:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/default"
# 此处的地址不影响匹配；第一个 VirtualHost 作为默认站点生效。
ServerName _
ErrorLog "/home/wwwlogs/IP-error_log"
# 日志里的客户端 IP 由 mod_remoteip 从 nginx 传来的 X-Forwarded-For 还原，
# 否则每一行都会记成 127.0.0.1（见 conf/mod_remoteip.conf）。
CustomLog "/home/wwwlogs/IP-access_log" combined
<Directory "/home/wwwroot/default">
    # FollowSymLinks 允许跟随符号链接。想更严可以换成 SymLinksIfOwnerMatch。
    # 不启用 Indexes，避免在缺少索引文件时列出目录内容。
    Options FollowSymLinks
    # default 是静态兜底目录，不读取 .htaccess；动态站点由 lnmp vhost add
    # 单独生成，仍可使用 Apache 的覆盖规则。
    AllowOverride None
    # Apache 2.4 的访问控制语法（2.2 的 Order/Allow 已废弃）。
    # 这里的 granted 是对 nginx 而言的，外部访问由前端 nginx 把关。
    Require all granted
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    # phpinfo / redis / memcached 三个演示页由 Enable_PHPInfo_Page、
    # Enable_Redis_Test_Page、Enable_Memcached_Test_Page 决定是否写入本目录，
    # 默认都不写。后出现的 FilesMatch 覆盖前一条，因此这三个固定文件名可执行；
    # 开关关闭时文件不存在，Apache 返回 404，不需要按开关改配置。
    # 前端 nginx 的 default 站点只把这三个文件名反代过来，其余 .php 直接 404。
    <FilesMatch "^(phpinfo|redis|memcached)\.php$">
        Require all granted
    </FilesMatch>
    DirectoryIndex index.html
</Directory>
</VirtualHost>
