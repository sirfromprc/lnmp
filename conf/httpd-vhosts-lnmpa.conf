# LNMPA 架构的默认虚拟主机。
# Apache 仅监听 127.0.0.1:88，由 Nginx 反代 PHP 请求；不得对外放行 88。
# 首个 VirtualHost 处理未匹配域名，用户站点由 lnmp vhost add 写入 conf/vhost/。
# 修改后运行 apachectl -S 和 apachectl -t。
# 文档：https://httpd.apache.org/docs/2.4/vhosts/
#
<VirtualHost *:88>
ServerAdmin webmaster@example.com
# open_basedir 限制 PHP 文件访问范围，缺少所需路径会导致文件访问失败。
#php_admin_value open_basedir "/home/wwwroot/default:/tmp/:/var/tmp/:/proc/"
DocumentRoot "/home/wwwroot/default"
# 默认站点由配置顺序决定。
ServerName _
ErrorLog "/home/wwwlogs/IP-error_log"
# mod_remoteip 从 Nginx 的 X-Forwarded-For 还原客户端地址。
CustomLog "/home/wwwlogs/IP-access_log" combined
<Directory "/home/wwwroot/default">
    # 仅跟随链接与目标属主一致的符号链接，不启用目录列表。
    Options SymLinksIfOwnerMatch
    # 默认静态站点不读取 .htaccess，动态站点可单独配置。
    AllowOverride None
    # 此权限仅面向本机 Nginx，外部访问由前端控制。
    Require all granted
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    # 仅允许 Nginx 转发的三个可选演示页执行 PHP；其余 PHP 请求被拒绝。
    <FilesMatch "^(phpinfo|redis|memcached)\.php$">
        Require all granted
    </FilesMatch>
    DirectoryIndex index.html
</Directory>

# 自定义配置--开始

# 自定义配置--结束
</VirtualHost>
