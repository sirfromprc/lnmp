# PATH_INFO 支持。被 enable-php-pathinfo.conf 引用，必须放在 include fastcgi.conf 之后
# （后写的 fastcgi_param 覆盖先写的）。四行都不能少，逐行说明：

# 1) 把 URI 切成「脚本路径」和「路径信息」两段。
#    /index.php/user/1  ->  $fastcgi_script_name=/index.php  $fastcgi_path_info=/user/1
#    +? 是非贪婪匹配：贪婪的话 /a.php/b.php 会把整串都当脚本名，
#    切分点跑到最后一个 .php 上，PATH_INFO 就丢了。
fastcgi_split_path_info ^(.+?\.php)(/.*)$;

# 2) 先把 $fastcgi_path_info 存进自定义变量。
#    看着像多此一举，其实是必需的：下面第 4 行的 try_files 会在内部重新走一遍
#    location 匹配，$fastcgi_path_info 在这个过程中会被重置为空。
#    先保存到 $path_info，避免后续指令覆盖该值。
set $path_info $fastcgi_path_info;

# 3) 把 PATH_INFO 显式传给 PHP。
#    本项目把 php.ini 的 cgi.fix_pathinfo 设成了 0（关掉 PHP 自己猜路径的行为，
#    那正是文件解析漏洞的根源），因此 PATH_INFO 必须由 nginx 这边明确给出，
#    否则框架拿不到路由信息。
fastcgi_param PATH_INFO       $path_info;

# 4) 存在性校验：等同于 enable-php.conf 中的 try_files $uri =404。
#    校验的是切分后的脚本名（/index.php），而不是带路径信息的完整 URI。
#    这样 /uploads/avatar.jpg/x.php 会因为 /uploads/avatar.jpg/x.php 不存在
#    而返回 404，不会被送进 php-fpm 执行。删掉这行等于把解析漏洞放回来。
try_files $fastcgi_script_name =404;
