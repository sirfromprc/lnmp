# PATH_INFO 配置必须在 fastcgi.conf 之后载入，使以下参数覆盖默认值。

# 1. 将 URI 拆分为脚本路径和 PATH_INFO，非贪婪匹配以第一个 .php 为边界。
fastcgi_split_path_info ^(.+?\.php)(/.*)$;

# 2. 在 try_files 重新匹配 location 前保存 PATH_INFO，防止变量被重置。
set $path_info $fastcgi_path_info;

# 3. cgi.fix_pathinfo=0 时由 Nginx 显式传递 PATH_INFO，避免 PHP 猜测脚本路径。
fastcgi_param PATH_INFO       $path_info;

# 4. 校验拆分后的脚本文件，防止不存在的路径被提交给 PHP-FPM。
try_files $fastcgi_script_name =404;
