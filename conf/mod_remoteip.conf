# LNMPA 中的 Apache 通过 X-Forwarded-For 还原 Nginx 转发前的客户端 IP。
# 仅可信代理可写入真实 IP；过宽的信任范围会使日志、限流和访问控制失效。

# X-Forwarded-For 由 conf/proxy.conf 设置。
RemoteIPHeader X-Forwarded-For

# 仅信任本机转发；本项目中的 nginx 与 Apache 部署在同一台主机上。
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy ::1

# 使用 CDN 时，逐条添加厂商公布的完整回源 IP 段，并随厂商变更更新：
#   RemoteIPInternalProxy 1.2.3.0/24
