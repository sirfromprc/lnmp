#
# 还原真实客户端 IP。仅 LNMPA 架构加载（Apache 躲在 nginx 后面，
# 直接看到的 remote_addr 永远是 127.0.0.1，日志和限流都没法用）。
#
# ★ 这份配置的安全性完全取决于 RemoteIPInternalProxy 写得准不准。
#   RemoteIPHeader 指定的头是客户端可以随便伪造的，只有当请求来自
#   InternalProxy 列出的地址时，Apache 才会采信它。列表写宽了
#   （比如写成 0.0.0.0/0），任何人都能把自己伪装成任意 IP，
#   访问日志、fail2ban、按 IP 的访问控制会一起失效。
#

# nginx 通过 proxy_set_header X-Forwarded-For 传过来（见 conf/proxy.conf）。
RemoteIPHeader X-Forwarded-For

# 仅信任本机转发；本项目中的 nginx 与 Apache 部署在同一台主机上。
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy ::1

# 如果在 nginx 前面还挂了 CDN（Cloudflare、又拍、阿里云 CDN 等），
# 真实客户端 IP 会在 X-Forwarded-For 链条的更前面。此时需要把 CDN 的
# 回源 IP 段也加进来（各家官网都有公开的 IP 段列表），逐条追加：
#   RemoteIPInternalProxy 1.2.3.0/24
# 注意要用 CDN 厂商公布的完整段，并在他们更新时同步维护。
