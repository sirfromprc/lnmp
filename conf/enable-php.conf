        # 把 PHP 请求交给 php-fpm。本文件由默认站点和 lnmp vhost add 生成的
        # 该虚拟主机 include 是全站 PHP 执行的唯一入口，修改前必须确认影响范围。
        #
        # 正则 [^/]\.php(/|$) 拆开看：
        #   [^/]      点号前必须有一个非斜杠字符，拒绝 "/.php" 等异常路径
        #   \.php     字面量 .php
        #   (/|$)     .php 后面要么到此为止，要么跟一个斜杠
        # 最后这个 (/|$) 是为了让 /index.php/user/1 这种 PATH_INFO 风格的
        # URL 也能命中。若只写 \.php$ 就只能匹配以 .php 结尾的 URL。
        location ~ [^/]\.php(/|$) {
            # ★ 这一行是安全边界，不要删。
            #
            # 上面的正则只看 URL 长什么样，不看文件是否真的存在。没有 try_files
            # 的话，请求 /uploads/avatar.jpg/x.php 同样会命中该 location 并被
            # 送进 php-fpm；配合某些 fastcgi 参数拼接方式，用户上传的 avatar.jpg
            # 可能被当作 PHP 执行，这是 nginx 文件解析漏洞的典型触发条件。
            #
            # try_files $uri =404 先确认 $uri 对应的文件确实存在，不存在直接 404。
            # 本项目另外还把 php.ini 的 cgi.fix_pathinfo 设成了 0，两道防线叠加。
            #
            # 代价：本文件不支持 PATH_INFO 型 URL（/index.php/foo 会 404）。
            # ThinkPHP、部分 Laravel 老版本等需要 PATH_INFO 的框架，
            # 请改用 enable-php-pathinfo.conf（lnmp vhost add 时选择开启 pathinfo）。
            try_files $uri =404;
            fastcgi_pass  unix:/tmp/php-cgi.sock;
            fastcgi_index index.php;
            # fastcgi.conf 是 nginx 自带的，比 fastcgi_params 多了一行
            # SCRIPT_FILENAME 的定义，缺了它 php-fpm 会报 "No input file specified"。
            include fastcgi.conf;
        }
