        # 默认 PHP-FPM 入口。正则要求 .php 前有非斜杠字符，后接斜杠或 URI 结束。
        location ~ [^/]\.php(/|$) {
            # 仅将真实存在的脚本交给 FPM，防止上传文件被路径拼接为 PHP 执行。
            # PATH_INFO 框架应使用 enable-php-pathinfo.conf。
            try_files $uri =404;
            fastcgi_pass  unix:/run/php-fpm/php-cgi.sock;
            fastcgi_index index.php;
            # fastcgi.conf 提供 PHP-FPM 所需的 SCRIPT_FILENAME。
            include fastcgi.conf;
        }
