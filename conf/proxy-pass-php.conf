        # LNMPA 由 Nginx 直接提供静态文件，其余请求转发给本机 Apache。

        # 文件不存在时转给 Apache，使目录索引和 .htaccess 重写规则生效。
        location / {
            try_files $uri @apache;
        }

        # internal 限制该入口只能由 Nginx 内部跳转访问。
        location @apache {
            internal;
            proxy_pass http://127.0.0.1:88;
            include proxy.conf;
        }

        # PHP 请求由 Apache 判断文件是否存在，不在 Nginx 侧重复校验。
        location ~ [^/]\.php(/|$) {
            proxy_pass http://127.0.0.1:88;
            include proxy.conf;
        }
