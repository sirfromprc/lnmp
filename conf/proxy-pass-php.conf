        # LNMPA 架构的请求分发规则：静态文件由 nginx 直接发，
        # 其余全部反代给本机 Apache(127.0.0.1:88) 由 mod_php 执行。
        # 本文件对应 LNMP 架构下的 enable-php.conf。

        # 先按 URI 找真实文件，找不到才转给 Apache。
        # 这样 CSS/JS/图片走 nginx（快、省内存），伪静态和目录索引走 Apache
        # （能读 .htaccess，WordPress 等程序的重写规则才生效）。
        location / {
            try_files $uri @apache;
        }

        # internal 表示这个 location 只能由 nginx 内部跳转进入，
        # 外部直接请求 /@apache 会返回 404，不会成为一个可探测的入口。
        location @apache {
            internal;
            proxy_pass http://127.0.0.1:88;
            include proxy.conf;
        }

        # PHP 请求无条件转给 Apache。这里不做 try_files 存在性校验，
        # 是因为 PHP 是否可执行由 Apache 那边判定（Apache 只对真实存在的
        # .php 文件调用 mod_php，不存在则返回 404）。
        location ~ [^/]\.php(/|$) {
            proxy_pass http://127.0.0.1:88;
            include proxy.conf;
        }
