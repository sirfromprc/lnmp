user  www www;

# worker 数量根据可用 CPU 自动调整，包括容器的 cgroup 配额。
worker_processes auto;
# CPU 亲和性可减少独占 CPU 环境中的核间迁移；共享 VPS 或容器可关闭此项。
worker_cpu_affinity auto;

# crit 仅记录严重错误；排查 502 或上游超时时可临时改为 error 或 warn。
error_log  /home/wwwlogs/nginx_error.log  crit;

pid        /usr/local/nginx/logs/nginx.pid;

# 文件描述符上限不得低于 worker_connections，并同时受系统 limits 约束。
worker_rlimit_nofile 51200;

events {
    use epoll;
    worker_connections 51200;
    # 每轮仅接收一个连接，使多个 worker 的负载更均衡。
    multi_accept off;
    # Linux 3.9 及以上由 SO_REUSEPORT 处理并发接收，无需 accept 互斥锁。
    accept_mutex off;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$time_iso8601 $status "$request_time" $remote_addr $request_method $scheme://$http_host$request_uri '
                    '$body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $remote_user';

    # 反向代理日志示例：仅在源站限制为可信代理访问时启用，防止伪造 IP 头。
    # map $http_x_real_ip $log_real_ip_fallback {
    #         ""      $remote_addr;
    #         default $http_x_real_ip;
    # }
    # map $http_x_forwarded_for $log_client_ip {
    #         ""                                      $log_real_ip_fallback;
    #         ~^\s*(?<forwarded_first_ip>[^,\s]+)     $forwarded_first_ip;
    #         default                                 $remote_addr;
    # }
    # log_format main_proxy '$time_iso8601 $status "$request_time" $log_client_ip $request_method $scheme://$http_host$request_uri '
    #                       '$body_bytes_sent "$http_referer" '
    #                       '"$http_user_agent" "$http_x_forwarded_for" $remote_user peer=$remote_addr';
    # 启用后将站点 access_log 的格式改为 main_proxy。

    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    # 请求体上限。PHP 的文件上限是 upload_max_filesize=50M，multipart 请求体
    # 还有 boundary 和表单字段开销，因此此处与 post_max_size 一样取 64M。
    client_max_body_size 64m;

    sendfile on;
    # 限制单次 sendfile 数据量，避免大文件传输长时间占用 worker。
    sendfile_max_chunk 512k;
    # 配合 sendfile 合并数据包，减少小包数量。
    tcp_nopush on;

    keepalive_timeout 60;

    # 立即发送已准备的数据，降低小响应延迟。
    tcp_nodelay on;

    # FastCGI 超时需与 PHP 的 max_execution_time 和 request_terminate_timeout 联合检查。
    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    # buffer_size 保存响应头，buffers 保存响应体；响应头过大可能返回 502。
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 256k;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_comp_level 2;
    # 仅压缩文本类内容，避免对图片、视频和归档文件重复压缩。
    gzip_types     text/plain text/css text/javascript
                   application/javascript application/x-javascript
                   application/json application/xml application/xml+rss
                   application/rss+xml image/svg+xml;
    # Vary 响应头使缓存区分压缩与未压缩版本。
    gzip_vary on;
    # 对符合指定缓存条件的上游响应启用压缩。
    gzip_proxied   expired no-cache no-store private auth;

    #limit_conn_zone $binary_remote_addr zone=perip:10m;
    ## 启用 limit_conn_zone 后，在 server 中添加 limit_conn perip 10;

    # 响应头和错误页不显示 Nginx 版本号。
    server_tokens off;
    # 全局关闭访问日志，由各 server 按需启用，避免未轮转日志占满磁盘。
    access_log off;

    server {
        listen 127.0.0.1:1008;
        server_name _;

        location /lua
        {
            default_type text/html;
            content_by_lua 'ngx.say("hello world")';
        }

        location /nginx_status {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            stub_status on;
        }

        # 内部状态端点，不记访问日志：健康探测每分钟一次，记录下来只有噪音和磁盘写入。
        access_log off;
    }

    # 自定义配置--开始

    # 自定义配置--结束

    include vhost/*.conf;
}
