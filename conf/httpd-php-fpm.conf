# MPM 与 PHP 处理器，由 httpd.conf 包含。
# PHP 经 mod_proxy_fcgi 交给 PHP-FPM（unix socket），MPM 使用 event。
#LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
#LoadModule mpm_worker_module modules/mod_mpm_worker.so
LoadModule mpm_event_module modules/mod_mpm_event.so

# PHP-FPM 未运行时 .php 返回 503，不会作为普通文件返回源码。
<IfModule proxy_fcgi_module>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php-fpm/php-cgi.sock|fcgi://localhost"
    </FilesMatch>
</IfModule>
# PHP-FPM 工作进程不还原上一请求的 PHP_ADMIN_VALUE，每个 PHP 请求都必须带值，
# 否则会继承同进程池上一站点的 open_basedir。这里给出默认站点范围的兜底，
# 虚拟主机与 Directory 内的同名指令后于本行求值并覆盖。
<IfModule proxy_fcgi_module>
    # PATH_TRANSLATED 由 mod_proxy_fcgi 按 PATH_INFO 另行拼出，与 SCRIPT_FILENAME 一起会使带 PATH_INFO 的
    # 请求被 FPM 判定为 Access denied；Nginx 的 fastcgi.conf 同样不传该变量。
    ProxyFCGISetEnvIf "true" !PATH_TRANSLATED
    ProxyFCGISetEnvIf "true" PHP_ADMIN_VALUE "open_basedir=/home/wwwroot/default:/tmp/:/var/tmp/:/proc/"
</IfModule>
# mod_proxy_fcgi 未加载时处理器不生效，在服务器级兜底拒绝。
<IfModule !proxy_fcgi_module>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</IfModule>
