        # enable-php.conf 的 PATH_INFO 版本，供 ThinkPHP / CodeIgniter 等
        # 依赖 /index.php/controller/action 这种 URL 的框架使用。
        # lnmp vhost add 询问「是否开启 pathinfo」时选 y 就会用到本文件。
        #
        # 与 enable-php.conf 的区别：这里没有 try_files $uri =404，
        # 因为 $uri 里带着 /controller/action，本来就不是一个真实存在的文件。
        # 等价的存在性校验挪到了 pathinfo.conf 的最后一行（对切分出来的
        # 脚本名执行 try_files），仍保留路径校验；详见 pathinfo.conf。
        location ~ [^/]\.php(/|$) {
            fastcgi_pass  unix:/tmp/php-cgi.sock;
            fastcgi_index index.php;
            include fastcgi.conf;
            include pathinfo.conf;
        }
