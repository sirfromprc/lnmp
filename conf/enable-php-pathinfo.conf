        # 支持 /index.php/controller/action 形式的 PATH_INFO 请求。
        # URI 本身不是文件，因此脚本存在性由 pathinfo.conf 校验。
        location ~ [^/]\.php(/|$) {
            fastcgi_pass  unix:/tmp/php-cgi.sock;
            fastcgi_index index.php;
            include fastcgi.conf;
            include pathinfo.conf;
        }
