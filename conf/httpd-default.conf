# Apache 全局默认参数（由 httpd.conf 的 Include conf/extra/httpd-default.conf 加载）。
# LAMP 与 LNMPA 两种架构共用本文件。

# 单次网络读写超时；PHP 脚本时长由 max_execution_time 控制。
Timeout 60

# 限制请求头和请求体的读取时间及最低速率，降低慢速请求占用。
# 大文件上传出现 408 时可降低 body 的 MinRate。
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# event MPM 使用长连接可减少 TCP 和 TLS 握手；LAMP 直连场景影响更明显。
KeepAlive On

# 单个长连接的最大请求数；0 表示不限制。
MaxKeepAliveRequests 1000

# 空闲长连接等待时间，避免连接长期占用资源。
KeepAliveTimeout 5

# 使用请求 Host 构造 URL，避免 LNMPA 重定向到 Apache 内部地址。
UseCanonicalName Off

# 目录级配置文件名；Nginx 前端会拒绝访问点号开头的文件。
AccessFileName .htaccess

# Server 响应头仅显示 Apache，不公开版本和模块信息。
ServerTokens Prod

# 错误页、目录列表和 mod_status 不附加版本或虚拟主机名。
ServerSignature Off

# 日志记录 IP，不为每个请求执行反向 DNS 查询。
HostnameLookups Off

# 仅压缩文本类型，避免对图片、视频和归档文件重复压缩。
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml application/rss+xml
    AddOutputFilterByType DEFLATE image/svg+xml
    # 6 在压缩率与 CPU 开销之间取平衡。
    DeflateCompressionLevel 6
</IfModule>
