#
# Apache 全局默认参数（由 httpd.conf 的 Include conf/extra/httpd-default.conf 加载）。
# LAMP 与 LNMPA 两种架构共用本文件。
#

#
# 单次网络读写的超时（秒）。这不是「PHP 脚本能跑多久」：
# 脚本时长由 php.ini 的 max_execution_time 控制。
# 值过大时，攻击者用极慢的速度发请求就能长期占住连接（slowloris），
# 因此保持在 60 秒，并用下面的 mod_reqtimeout 做更精细的限制。
#
Timeout 60

#
# 针对「读请求头」和「读请求体」分别设限，专门对付慢速攻击。
# header=20-40,MinRate=500 的含义：请求头必须在 20 秒内读完；
# 客户端每多送 500 字节就多给 1 秒，但总时长不超过 40 秒。
# 上传大文件的站点如果出现 408，把 body 的 MinRate 调低即可。
#
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

#
# 保持长连接：一个 TCP 连接上可以跑多个请求，省掉反复的三次握手和 TLS 握手。
# 本项目用的是 event MPM，闲置的长连接由单独的监听线程照看，
# 不会像 prefork 那样一个连接占住一个进程，所以开着的代价很小。
#
# LNMPA 架构下前端是 nginx，Apache 只处理来自本机的转发，
# 这几个值怎么设都影响不大；LAMP 架构（Apache 直接对外）才是它们真正生效的地方。
#
KeepAlive On

#
# 一个长连接上最多处理多少个请求。设 0 为不限制。
#
MaxKeepAliveRequests 1000

#
# 长连接上等待下一个请求的秒数。这个值直接决定了闲置连接占用资源的时长，
# 5 秒足够浏览器把一个页面的资源取完，再大只是白白占着连接。
#
KeepAliveTimeout 5

#
# Off = 用客户端请求里的 Host 头来构造自引用 URL 和 SERVER_NAME。
# 反向代理场景（LNMPA）必须是 Off，否则 Apache 会用自己的 ServerName
# 生成重定向地址，把用户跳到 127.0.0.1 上去。
#
UseCanonicalName Off

#
# 目录级配置文件的文件名。改这个名字并不能提高安全性 ：
# nginx 侧已用 "location ~ /\." 拒绝了所有点号开头的文件的访问。
#
AccessFileName .htaccess

#
# 响应头 Server 字段的详细程度：Full | OS | Minor | Minimal | Major | Prod。
# Prod 只输出 "Apache"，不带版本号和已加载模块 ：
# 版本号是攻击者挑选可用漏洞的第一手信息，没有理由主动给出。
#
ServerTokens Prod

#
# Off = 错误页、目录列表、mod_status 输出里不附加版本号和虚拟主机名。
# 与上面的 ServerTokens Prod 是一对，只设一个等于没设 ：
# 版本号会从错误页那条路漏出去。
#
ServerSignature Off

#
# Off = 日志里只记 IP，不做反向 DNS 解析。
# 开成 On 的话每个请求都要等一次 DNS 查询，延迟直接上去，而且解析结果并不可信。
# 需要域名时在离线分析日志的阶段再解析。
#
HostnameLookups Off

#
# 压缩。只对文本类型开启 ：
# 图片、视频、woff2、zip 本身已是压缩格式，再压一遍只烧 CPU 不省流量。
#
# 注意必须用 AddOutputFilterByType（按类型挑），
# 不要用 SetOutputFilter DEFLATE（不分类型，全都压）。
#
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml application/rss+xml
    AddOutputFilterByType DEFLATE image/svg+xml
    # 1-9，越大压得越狠也越费 CPU。6 是压缩率与开销的常用平衡点。
    DeflateCompressionLevel 6
</IfModule>
