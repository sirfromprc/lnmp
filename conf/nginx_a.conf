user  www www;

# auto = 按 CPU 核数起 worker。不要手工写死数字，
# 容器里被限了 CPU 配额时 auto 也会跟着 cgroup 走。
worker_processes auto;
# 把 worker 绑到各自的 CPU 核上，减少核间迁移导致的缓存失效。
# 只在物理机/独占 CPU 时有意义。在超卖的 VPS 或容器里绑核会让 worker
# 挤在同一批被限速的核上，此时应注释掉本行。
worker_cpu_affinity auto;

# crit 只记严重错误，日志量最小。排查 502 / upstream 超时时
# 临时改成 error 或 warn 会有用得多，改完 nginx -s reload 即可，不必重启。
error_log  /home/wwwlogs/nginx_error.log  crit;

pid        /usr/local/nginx/logs/nginx.pid;

# 单个 worker 能打开的文件描述符上限，必须 >= worker_connections，
# 否则高并发时会出现 "Too many open files"。
# 该值还受系统 limits 约束，安装时已同步调过 /etc/security/limits.conf。
worker_rlimit_nofile 51200;

events {
        use epoll;
        worker_connections 51200;
        # off = 一次事件循环只 accept 一个连接。开成 on 会让单个 worker
        # 一口气吞下所有待处理连接，多 worker 时容易造成负载倾斜。
        multi_accept off;
        # off = 不做 accept 串行化。Linux 3.9+ 有 SO_REUSEPORT，惊群已由内核解决，
        # 再加互斥锁只会增加延迟（默认站点的 listen 带 reuseport 时尤其如此）。
        accept_mutex off;
    }

http {
        include       mime.types;
        default_type  application/octet-stream;

        server_names_hash_bucket_size 128;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        # 上传体积上限。必须和 PHP 的 upload_max_filesize / post_max_size 一起改，
        # 只改一边的结果是 nginx 放行、PHP 再拒一次，用户看到空白页或 500。
        client_max_body_size 50m;

        sendfile on;
        # 单次 sendfile 最多传 512k。不限制的话一个大文件下载会长时间占住 worker，
        # 同 worker 上的其它请求都被拖慢。
        sendfile_max_chunk 512k;
        # 配合 sendfile：先攒满一个数据包再发，减少小包数量。
        tcp_nopush on;

        keepalive_timeout 60;

        # 对已攒好的数据立刻发送，不等 Nagle 凑包，降低小响应延迟。
        # 与 tcp_nopush 不冲突，nginx 会在响应结尾自动切换。
        tcp_nodelay on;

        # --- FastCGI（与 php-fpm 通信）---
        # read_timeout 300 表示 PHP 脚本最长可跑 300 秒。PHP 侧还有
        # max_execution_time / request_terminate_timeout 两道限制，
        # 出现 504 时要三个值一起看，最短的那个才真正生效。
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        # buffer_size 存响应头，buffers 存响应体。响应体超出会落盘到临时文件
        # （降速但不报错）；响应头超出 buffer_size 则直接 502。
        # 用了大 Cookie 或长 Set-Cookie 的站点报 502 时，先加大 buffer_size。
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        gzip on;
        gzip_min_length  1k;
        gzip_buffers     4 16k;
        gzip_comp_level 2;
        # 只压缩文本类。图片、视频、woff2、zip 本身已是压缩格式，
        # 再压一遍只烧 CPU 不省流量，不要往下面加。
        gzip_types     text/plain text/css text/javascript
                       application/javascript application/x-javascript
                       application/json application/xml application/xml+rss
                       application/rss+xml image/svg+xml;
        # 告诉缓存服务器「同一 URL 有压缩/未压缩两个版本」。
        # 不加这行，CDN 可能把 gzip 后的内容发给不支持 gzip 的客户端。
        gzip_vary on;
        # 默认 nginx 不压缩来自上游的响应（怕破坏缓存语义），
        # 这行把带这些缓存头的响应也纳入压缩范围。
        gzip_proxied   expired no-cache no-store private auth;

        #limit_conn_zone $binary_remote_addr zone=perip:10m;
        ##If enable limit_conn_zone,add "limit_conn perip 10;" to server section.

        # 不在响应头和错误页里暴露 nginx 版本号
        server_tokens off;
        # http 级别关闭访问日志，再由各 server 块按需打开。这样新建的 vhost
        # 默认不写日志，避免忘记配置轮转把磁盘写满。
        access_log off;

server {
        listen 80 default_server;
        #listen [::]:80 default_server ipv6only=on;
        # server_name _ 是个永远匹配不上的假域名，真正起作用的是上面的
        # default_server：接收未匹配其他 vhost 的请求，包括直接通过 IP 访问
        # 都会落到这个 server 块。
        server_name _;
        index index.html index.htm index.php;
        root  /home/wwwroot/default;

        #error_page   404   /404.html;

        # Deny access to PHP files in specific directory
        #location ~ /(wp-content|uploads|wp-includes|images)/.*\.php$ { deny all; }

        # LNMPA 架构：nginx 只做前端，PHP 请求反代给后端 Apache(127.0.0.1:88)，
        # 由 Apache 的 mod_php 执行。静态文件仍由上面的 location 直接由 nginx 发出。
        include proxy-pass-php.conf;

        # phpMyAdmin 的访问入口。该片段由安装脚本按开关生成或删除，
        # 路径是随机的，不要手工编辑。通配符没匹配到文件时不会报错，
        # 因此未启用 phpMyAdmin 时这一行不产生任何影响。
        include phpmyadmin.*.conf;

        # stub_status 会暴露当前连接数、请求总量等运行数据，是给攻击者做
        # 流量画像的素材，因此只对本机开放。需要 Zabbix / Prometheus 远程采集时，
        # 把采集端 IP 加进 allow，不要直接删掉 deny all。
        location /nginx_status {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            stub_status on;
            access_log   off;
        }

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
            expires      30d;
        }

        location ~ .*\.(js|css)$ {
            expires      12h;
        }

        # ACME（Let's Encrypt / ZeroSSL）的 HTTP-01 验证会来读
        # /.well-known/acme-challenge/xxx。该目录以点号开头，会被下面
        # "location ~ /\." 的 deny all 拦住，所以必须先放行。
        #
        # 用 ^~ 而非 ~：^~ 是前缀匹配且优先级高于所有正则，命中后 nginx
        # 立即停止匹配，不会再走到 deny 那条，与规则书写顺序无关。
        location ^~ /.well-known/ {
            allow all;
        }

        # 拒绝一切以点号开头的路径：.git / .env / .htaccess / .user.ini 等。
        # 这些文件一旦能被下载，等于直接交出源码和数据库口令。
        location ~ /\. {
            deny all;
        }

        access_log  /home/wwwlogs/access.log;
    }
include vhost/*.conf;
}
