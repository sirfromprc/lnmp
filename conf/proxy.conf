# nginx 作为反向代理时的公共参数。LNMPA 架构下由 proxy-pass-php.conf 引用，
# 自己写反代 vhost 时也可以 include 本文件。

# 连后端的超时。后端是本机 Apache 时 300s 已经很宽裕；
# 若后端在外网且不稳定，这个值宜调小（连不上就该快速失败，而不是挂住 worker）。
proxy_connect_timeout 300s;
# 等待后端响应的超时。后端跑长任务（导出、批量处理）时要一起调大，
# 否则 nginx 先超时返回 504，后端其实还在跑。
proxy_send_timeout   900;
proxy_read_timeout   900;

# buffer_size 存响应头，buffers 存响应体，超出部分落盘到临时文件。
# 后端 Set-Cookie 很长时报 502，先加大 buffer_size。
proxy_buffer_size    32k;
proxy_buffers     4 32k;
proxy_busy_buffers_size 64k;

# 用 HTTP/1.1 与后端通信。HTTP/1.0 不支持 chunked 请求体，
# 上传大文件或调用某些 API 时会失败。
proxy_http_version 1.1;

# off = 不改写后端返回的 Location / Refresh 头。
# 后端已经通过下面的 Host 头知道了真实域名，会自己生成正确的绝对地址，
# 再让 nginx 改写反而容易改错。
proxy_redirect     off;

# 清空发给后端的 Accept-Encoding，让后端返回未压缩内容，
# 压缩统一交给 nginx（见 nginx.conf 的 gzip 段）做。
# 好处是压缩策略只有一处、后端也省 CPU；代价是后端的压缩配置失效。
proxy_set_header   Accept-Encoding '';
# 上一行让后端不再按编码分版本，其 Vary 头已无意义，去掉；
# nginx 自己会按 gzip_vary 重新补一个正确的 Vary: Accept-Encoding。
proxy_hide_header  Vary;

# 把客户端请求的原始 Host 透传给后端。不能省 ：
# 不加这行 nginx 会发 proxy_pass 里写的 127.0.0.1，
# 后端就只能落到默认虚拟主机，多站点全部串站。
proxy_set_header   Host   $http_host;

# 后端看到的 remote_addr 是 nginx 的地址，真实客户端 IP 靠下面两个头传递。
# X-Real-IP 是单个 IP；X-Forwarded-For 会在已有值后面追加，形成调用链。
# Apache 侧由 mod_remoteip 读取并还原（见 conf/mod_remoteip.conf）。
proxy_set_header   X-Real-IP  $remote_addr;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
# 告诉后端外部用的是 http 还是 https。WordPress 等程序靠它判断是否
# 需要把站内链接写成 https，缺了会出现「后台一直跳转」或混合内容。
proxy_set_header   X-Forwarded-Proto $scheme;

# WebSocket 需要额外两个头才能完成协议升级。本文件被普通 HTTP 反代共用，
# 所以默认不开；确实要代理 WebSocket 时，在对应 location 里单独加上：
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection "upgrade";
