# Nginx 反向代理公共参数，供 LNMPA 和自定义反向代理站点引用。

# 后端位于外部网络时可缩短连接超时，以便连接失败后尽快返回。
proxy_connect_timeout 300s;
# 长任务超过读写超时时，Nginx 会返回 504，但后端任务可能仍在运行。
proxy_send_timeout   900;
proxy_read_timeout   900;

# buffer_size 保存响应头，buffers 保存响应体；响应头过大可能返回 502。
proxy_buffer_size    32k;
proxy_buffers     4 32k;
proxy_busy_buffers_size 64k;

# HTTP/1.1 支持分块请求体，适用于大文件上传和相关 API。
proxy_http_version 1.1;

# 保留后端根据原始 Host 生成的 Location 和 Refresh 响应头。
proxy_redirect     off;

# 清空 Accept-Encoding，由 Nginx 统一压缩响应，避免后端重复压缩。
proxy_set_header   Accept-Encoding '';
# 移除后端 Vary，由 Nginx 根据 gzip_vary 生成正确响应头。
proxy_hide_header  Vary;

# 透传原始 Host，使后端匹配正确的虚拟主机。
proxy_set_header   Host   $http_host;

# 传递客户端 IP 和代理链，Apache 由 mod_remoteip 还原真实来源。
proxy_set_header   X-Real-IP  $remote_addr;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
# 传递外部协议，防止应用产生错误跳转或混合内容。
proxy_set_header   X-Forwarded-Proto $scheme;

# WebSocket 代理需在对应 location 中添加：
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection "upgrade";
