server {
        listen 80;
        #listen [::]:80;
        server_name example.com www.example.com;

        #如果需要http 301跳转到 https 需要将下面行前面的 # 注释去掉，并重载nginx
        #return 301 https://$host$request_uri;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version    1.1;
            proxy_cache_bypass    $http_upgrade;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;
        }

        access_log off;
    }

server {
        listen 443 ssl;
        http2 on;
        #listen [::]:443 ssl;
        server_name example.com www.example.com;

        ssl_certificate /usr/local/nginx/conf/ssl/example.com.crt;
        ssl_certificate_key /usr/local/nginx/conf/ssl/example.com.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        # 只保留带前向保密（ECDHE/DHE）的 AEAD 套件；
        # 排除 3DES(Sweet32)、静态 RSA(无前向保密)、CBC(Lucky13 系列)。
        # TLS 1.3 有独立的套件命名空间，不受本行控制。
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        # off = 让客户端挑，手机可选到有硬件加速的 CHACHA20。
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        # 关闭 session ticket：其加密密钥长期不变，泄露会抵消前向保密。
        ssl_session_tickets off;
        # openssl dhparam -out /usr/local/nginx/conf/ssl/dhparam.pem 2048
        ssl_dhparam /usr/local/nginx/conf/ssl/dhparam.pem;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version    1.1;
            proxy_cache_bypass    $http_upgrade;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;
        }

        access_log off;
    }
