<VirtualHost *:443>
DocumentRoot /home/wwwroot/lnmp.org
ServerName lnmp.org:443
ServerAlias www.lnmp.org
ServerAdmin admin@lnmp.org
ErrorLog "/home/wwwlogs/lnmp.org-error_log"
CustomLog "/home/wwwlogs/lnmp.org-access_log" combined
SSLEngine on
# 证书由 lnmp ssl add 生成，路径中的域名需替换为实际站点域名。
SSLCertificateFile /usr/local/apache/conf/ssl/lnmp.org/lnmp.org.cer
SSLCertificateKeyFile /usr/local/apache/conf/ssl/lnmp.org/lnmp.org.key
SSLCertificateChainFile /usr/local/apache/conf/ssl/lnmp.org/ca.cer
<Directory "/home/wwwroot/lnmp.org">
    Options SymLinksIfOwnerMatch
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
</Directory>
</VirtualHost>
