<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Welcome</title>
<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --fg: #1f2328;
  --muted: #6b7280;
  --line: #e5e7eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --fg: #e6e8eb;
    --muted: #9aa3af;
    --line: #262b33;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
.card {
  width: 100%;
  max-width: 520px;
  padding: 40px 32px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  text-align: center;
}
h1 {
  margin: 0 0 12px;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: .2px;
}
p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-bottom: 18px;
  border-radius: 50%;
  background: #22c55e;
}
</style>
</head>
<body>
<div class="card">
<span class="dot"></span>
<h1>Welcome</h1>
<p>站点已就绪，内容尚未发布。</p>
<p>This site is up and running. No content has been published yet.</p>
</div>
</body>
</html>
