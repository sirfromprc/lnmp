# LNMP 2.3 安装配置
#
# 所有变量都写成 ${VAR:-默认值}，可以用环境变量覆盖而不必改这个文件：
#   Default_Website_Dir=/data/wwwroot Pureftpd_Port=2121 ./install.sh lnmp
#
# 本文件仅在安装和升级时读取。已安装服务应修改其运行配置，相关位置见各项说明。

## ---------------------------------------------------------------------------
## 编译参数
## ---------------------------------------------------------------------------
## 命令前传入同名环境变量可临时覆盖，例如：
## Nginx_Modules_Options="--with-http_slice_module" ./install.sh lnmp
## 如需在外部参数后追加固定模块：
## Nginx_Modules_Options="${Nginx_Modules_Options:-} --with-http_dav_module"

Nginx_Modules_Options="${Nginx_Modules_Options:-}"
PHP_Modules_Options="${PHP_Modules_Options:-}"

##MySQL/MariaDB database directory##
MySQL_Data_Dir="${MySQL_Data_Dir:-/usr/local/mysql/var}"
MariaDB_Data_Dir="${MariaDB_Data_Dir:-/usr/local/mariadb/var}"
##Default website home directory##
Default_Website_Dir="${Default_Website_Dir:-/home/wwwroot/default}"

##Web-accessible tools##
## Web 工具默认关闭。phpinfo 会公开运行环境；phpMyAdmin 启用后使用随机访问路径。
Enable_PHPInfo_Page="${Enable_PHPInfo_Page:-n}"
Enable_PhpMyAdmin="${Enable_PhpMyAdmin:-n}"
## Memcached 演示页无访问控制。
Enable_Memcached_Test_Page="${Enable_Memcached_Test_Page:-n}"
## Redis 演示页无访问控制，并会执行一次 set/del 测试。
Enable_Redis_Test_Page="${Enable_Redis_Test_Page:-n}"

Enable_Nginx_Openssl="${Enable_Nginx_Openssl:-y}"
## Lua 支持包含 LuaJIT、lua-nginx-module、ngx_devel_kit 及常用 lua-resty 库。
Enable_Nginx_Lua="${Enable_Nginx_Lua:-y}"
## Brotli 依赖 libbrotli-dev / brotli-devel；依赖不可用时可设为 n。
Enable_Ngx_Brotli="${Enable_Ngx_Brotli:-y}"
## 缓存清除模块，提供 proxy_cache_purge / fastcgi_cache_purge 指令。
Enable_Ngx_CachePurge="${Enable_Ngx_CachePurge:-y}"
Enable_Ngx_FancyIndex="${Enable_Ngx_FancyIndex:-n}"
Enable_Swap="${Enable_Swap:-y}"

## PHP 安装完成后自动装上的常用扩展（见 include/php_default_ext.sh）。
## 单个扩展失败仅在安装结束时汇总告警；imagick 依赖 ImageMagick。
Enable_PHP_Default_Opcache="${Enable_PHP_Default_Opcache:-y}"
Enable_PHP_Default_Igbinary="${Enable_PHP_Default_Igbinary:-y}"
Enable_PHP_Default_Redis="${Enable_PHP_Default_Redis:-y}"
Enable_PHP_Default_Imagick="${Enable_PHP_Default_Imagick:-y}"

Enable_PHP_Exif="${Enable_PHP_Exif:-n}"
## fileinfo 在 PHP 编译阶段启用，文件上传的 MIME 检测通常依赖它。
Enable_PHP_Fileinfo="${Enable_PHP_Fileinfo:-y}"
Enable_PHP_Ldap="${Enable_PHP_Ldap:-n}"
Enable_PHP_Bz2="${Enable_PHP_Bz2:-n}"
Enable_PHP_Sodium="${Enable_PHP_Sodium:-n}"
Enable_PHP_Imap="${Enable_PHP_Imap:-n}"

Download_Insecure="${Download_Insecure:-n}"
Enable_Download_Checksum="${Enable_Download_Checksum:-y}"

## ---------------------------------------------------------------------------
## 服务端口
##
## 这些值会同时写入服务配置和 nftables 规则，避免监听端口与防火墙规则不一致。
##
## Nginx 的 80/443 分别由主配置、站点配置和证书流程管理，不在此处配置。
## ---------------------------------------------------------------------------
## SSH。仅用于生成放行规则，本包不会去改 sshd_config。
## SSH 使用非默认端口时必须同步修改，否则防火墙不会放行实际监听端口。
SSH_Port="${SSH_Port:-22}"

## 数据库监听端口。写进 /etc/my.cnf，并按此端口设置阻断规则。
DB_Port="${DB_Port:-3306}"

## MySQL X Protocol 端口。它不受 my.cnf 的 bind-address 约束，
## 可执行 SQL，因此需要与主端口一并限制。MariaDB 不使用此端口。
DB_X_Port="${DB_X_Port:-33060}"

## Redis。写进 redis.conf、init 脚本与自测页，并按此端口阻断。
Redis_Port="${Redis_Port:-6379}"

## Memcached。写进 init 脚本与自测页，并按此端口阻断。
Memcached_Port="${Memcached_Port:-11211}"

## Pure-FTPd。控制端口写进 pure-ftpd.conf 的 Bind，被动模式范围写进
## PassivePortRange，三者都会自动放行。
## 被动模式范围要留够：每个并发传输占一个端口。
Pureftpd_Port="${Pureftpd_Port:-21}"
Pureftpd_Data_Port="${Pureftpd_Data_Port:-20}"
Pureftpd_Passive_Min="${Pureftpd_Passive_Min:-20000}"
Pureftpd_Passive_Max="${Pureftpd_Passive_Max:-30000}"

## ---------------------------------------------------------------------------
## OpenResty 自定义编译模块与 Lua 库
##
## 仅在 ORMode=2 源码编译时生效；软件包安装不支持编译期模块，配置后会报错。
##
## 每条格式：名称|下载地址|SHA256|类型
##   名称     只允许字母数字点下划线连字符，会用作源码目录名
##   下载地址 必须是 https，指向模块仓库的归档包（.tar.gz）
##   SHA256   必填；下载后使用 sha256sum <文件> 计算
##   类型     static  = 直接编进 nginx 二进制
##            dynamic = 编成 .so，安装后自动生成 load_module 指令
##
## 例（GeoIP2 动态模块）：
##   OpenResty_Custom_Modules=(
##       "ngx_http_geoip2|https://github.com/leev/ngx_http_geoip2_module/archive/refs/tags/3.4.tar.gz|填入实际SHA256|dynamic"
##   )
##
## 配置会记录到 /etc/lnmp/openresty-build.conf，供 OpenResty 升级沿用。
OpenResty_Custom_Modules=()

## 不需要下载源码的额外 configure 参数，例如 "--with-http_dav_module"
OpenResty_Modules_Options="${OpenResty_Modules_Options:-}"

## 自定义 Lua 库目录（绝对路径）。配置后会加进 lua_package_path，
## 目录中的 .lua 文件可直接 require；留空时仅使用 OpenResty 自带 lualib。
OpenResty_Custom_Lualib="${OpenResty_Custom_Lualib:-}"

## opm 包（OpenResty 自带的包管理器），如 "ledgetech/lua-resty-http"
OpenResty_Opm_Packages=()

## luarocks 包。需要系统里已经装了 luarocks，本包不负责安装它。
OpenResty_Luarocks_Packages=()
## ---------------------------------------------------------------------------

## 是否关闭 SELinux。
##
## 默认 'n'，保留系统强制访问控制。
##
## 注意：源码安装到 /usr/local 时可能缺少发行版预置策略。
## 安装或启动发生权限问题时，应先检查 /var/log/audit/audit.log；
## 确认为 SELinux 拒绝后，可将此项设为 'y' 进行诊断。
Disable_Selinux="${Disable_Selinux:-n}"

## 离线 / 受限网络模式开关。
##
## 控制安装前的联网准备动作。设为 'n' 时跳过：
##   - NTP 对时、apt-get update、替换系统软件源（Modify_Source）
##   - 安装前的 DNS 连通性探测
## 并且数据库默认改为源码编译而不是下载通用二进制。
##
## 注意：设 'n' 并不会跳过组件源码的下载，那些是安装本身必需的，
## 真正离线安装需要预先把 src/ 填满。
##
## 可通过 CheckMirror 环境变量临时覆盖。
CheckMirror="${CheckMirror:-y}"
