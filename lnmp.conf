




Nginx_Modules_Options="${Nginx_Modules_Options:-}"
PHP_Modules_Options="${PHP_Modules_Options:-}"

##MySQL/MariaDB database directory##
MySQL_Data_Dir="${MySQL_Data_Dir:-/usr/local/mysql/var}"
MariaDB_Data_Dir="${MariaDB_Data_Dir:-/usr/local/mariadb/var}"
##Default website home directory##
Default_Website_Dir="${Default_Website_Dir:-/home/wwwroot/default}"

##Web-accessible tools##
## 这些页面部署在网站根目录，任何人可访问，默认关闭。
## phpinfo 会泄露完整 PHP 配置、绝对路径、扩展列表以及 $_SERVER/$_ENV
## （后者常包含数据库凭据与 API 密钥）。
## phpMyAdmin 使用固定路径 /phpmyadmin/，直接暴露数据库爆破面。
Enable_PHPInfo_Page="${Enable_PHPInfo_Page:-n}"
Enable_PhpMyAdmin="${Enable_PhpMyAdmin:-n}"
## memcached 的 PHP 演示页，同样部署在网站根目录且无鉴权。
Enable_Memcached_Test_Page="${Enable_Memcached_Test_Page:-n}"
## redis 的 PHP 演示页，性质同上：无鉴权、回显 Redis 版本号，
## 且每次访问都会对生产 Redis 做一次 set/del 写操作。
Enable_Redis_Test_Page="${Enable_Redis_Test_Page:-n}"

Enable_Nginx_Openssl="${Enable_Nginx_Openssl:-y}"
## Lua 支持：装 LuaJIT + lua-nginx-module + ngx_devel_kit，
## 并附带 lua-cjson、lua-resty-lock 及一批常用 lua-resty-* 库。
## 会明显拉长编译时间，但这些是 openresty 生态的常用件，默认开启。
Enable_Nginx_Lua="${Enable_Nginx_Lua:-y}"
## Brotli 压缩。依赖系统的 libbrotli-dev / brotli-devel（依赖清单里已加），
## 装不上时 ngx_brotli 的 config 会报错，届时改成 n 即可跳过。
Enable_Ngx_Brotli="${Enable_Ngx_Brotli:-y}"
## 缓存清除模块，提供 proxy_cache_purge / fastcgi_cache_purge 指令。
Enable_Ngx_CachePurge="${Enable_Ngx_CachePurge:-y}"
Enable_Ngx_FancyIndex="${Enable_Ngx_FancyIndex:-n}"
Enable_Swap="${Enable_Swap:-y}"

## PHP 安装完成后自动装上的常用扩展（见 include/php_default_ext.sh）。
## 单个装失败不会中止安装，只在结尾汇总告警。
## imagick 需要先编译 ImageMagick 本体，会额外花几分钟。
Enable_PHP_Default_Opcache="${Enable_PHP_Default_Opcache:-y}"
Enable_PHP_Default_Igbinary="${Enable_PHP_Default_Igbinary:-y}"
Enable_PHP_Default_Redis="${Enable_PHP_Default_Redis:-y}"
Enable_PHP_Default_Imagick="${Enable_PHP_Default_Imagick:-y}"

Enable_PHP_Exif="${Enable_PHP_Exif:-n}"
## fileinfo 是 configure 阶段决定的，必须在编译前就是 y 才会编进去。
## 很多框架（文件上传做 MIME 检测）依赖它，故默认开启。
Enable_PHP_Fileinfo="${Enable_PHP_Fileinfo:-y}"
Enable_PHP_Ldap="${Enable_PHP_Ldap:-n}"
Enable_PHP_Bz2="${Enable_PHP_Bz2:-n}"
Enable_PHP_Sodium="${Enable_PHP_Sodium:-n}"
Enable_PHP_Imap="${Enable_PHP_Imap:-n}"

Download_Insecure="${Download_Insecure:-n}"
Enable_Download_Checksum="${Enable_Download_Checksum:-y}"

## 是否关闭 SELinux。
##
## 默认 'n'，保留系统强制访问控制。
##
## 注意：源码安装到 /usr/local 时可能缺少发行版预置策略。
## 安装或启动发生权限问题时，应先检查 /var/log/audit/audit.log；
## 确认为 SELinux 拒绝后，可将此项设为 'y' 进行诊断。
Disable_Selinux="${Disable_Selinux:-n}"

## 离线 / 受限网络模式开关。
##
## 控制安装前的联网准备动作。设为 'n' 时跳过：
##   - NTP 对时、apt-get update、替换系统软件源（Modify_Source）
##   - 安装前的 DNS 连通性探测
## 并且数据库默认改为源码编译而不是下载通用二进制。
##
## 注意：设 'n' 并不会跳过组件源码的下载，那些是安装本身必需的，
## 真正离线安装需要预先把 src/ 填满。
##
## 使用 ${CheckMirror:-y} 保留环境变量覆盖能力；本文件其他开关采用相同写法。
CheckMirror="${CheckMirror:-y}"
