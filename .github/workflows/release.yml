# 发布流程。编译验证失败时不创建 Release。
#
# 关于版本号：产品版本取自 install.sh 的 LNMP_Ver，由 t/product_version.sh 提取，
# 工作流内不硬编码。分支名（v2.3、v2.4）不参与取值。
# 产品版本不随发布次数递增，日期只用于区分发布批次。
# git tag 必须唯一；同名 tag 指向不同内容会破坏下载文件的稳定校验。
#
# 一次发布产出两个包，同属一个 Release：
#   tag        v2.3-20260908                每次发布唯一
#   release 名 LNMP v2.3 (20260908)
#   包         lnmp-v2.3.tar.gz             主分支，组件版本由维护者手工确认
#              lnmp-v2.3-20260908.tar.gz    最新 auto-<日期> 分支，含自动升级
#
# 两个包分开的原因：主分支的源码改动不会覆盖自动升级过的组件版本，
# 自动升级也不会把未经确认的组件版本带进主分支。
# 没有 auto-<日期> 分支时只发主分支那一个包。
#
# 固定下载地址（不需要移动 tag）：
#   /releases/latest/download/lnmp-v2.3.tar.gz
#
# 默认生成 GitHub 构建证明（attestation），验证方式：
#   gh attestation verify <包名>.tar.gz --repo <owner>/<repo>
# 配置 GPG_PRIVATE_KEY / GPG_PASSPHRASE 后额外生成 .asc 分离签名。

name: 发布

on:
  # upstream-check.yml 完成每月升级后调用，实现自动发布。
  workflow_call:
    inputs:
      level:
        description: '发布前的编译验证深度'
        type: string
        default: full
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      level:
        description: '发布前的编译验证深度（正式发布建议 full）'
        type: choice
        options: [full, quick]
        default: full
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false
  push:
    tags:
      # 产品版本不写死，形如 v2.3-20260908 的 tag 都能触发。
      - 'v[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  # 静态检查
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash t/lint.sh
      - run: bash t/consistency.sh
      - run: bash t/test_profile.sh
      - run: bash t/test_dispatch.sh
      - run: bash t/test_bump.sh
      - run: bash t/test_upstream.sh

  # 编译验证
  build:
    name: 编译验证
    needs: static
    uses: ./.github/workflows/build-test.yml
    with:
      # tag 触发时 inputs 为空，正式发布一律走 full
      level: ${{ inputs.level || 'full' }}

  # 打包并发布
  publish:
    name: 打包发布
    needs: [static, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 建 release、推 tag
      id-token: write      # 构建证明要用 OIDC
      attestations: write  # 写构建证明
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 确定版本与发布标识
        id: ver
        run: |
          set -e
          # 产品版本取自 install.sh，工作流不硬编码，分支名不参与。
          PRODUCT_VER="$(bash t/product_version.sh --tag)"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            TAG="${{ github.ref_name }}"
            case "${TAG}" in
              "${PRODUCT_VER}-"*) ;;
              *)
                echo "错误：tag ${TAG} 与源码的产品版本 ${PRODUCT_VER} 不符。" >&2
                exit 1
                ;;
            esac
            STAMP="${TAG#"${PRODUCT_VER}"-}"
          else
            STAMP="$(date -u '+%Y%m%d')"
            TAG="${PRODUCT_VER}-${STAMP}"
          fi
          {
            echo "product=${PRODUCT_VER}"
            echo "tag=${TAG}"
            echo "stamp=${STAMP}"
            echo "base_pkg=lnmp-${PRODUCT_VER}"
            echo "auto_pkg=lnmp-${PRODUCT_VER}-${STAMP}"
          } >> "$GITHUB_OUTPUT"
          echo "将发布 ${TAG}（产品版本 ${PRODUCT_VER}）"

      - name: 查找最新的自动升级分支
        id: auto
        run: |
          set -e
          git fetch --quiet origin '+refs/heads/auto-*:refs/remotes/origin/auto-*' 2>/dev/null || true
          branch=$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/auto-*' \
                     | grep -E '^auto-[0-9]{8}$' | sort | tail -1 || true)
          if [ -z "${branch}" ]; then
            echo "没有 auto-<日期> 分支，本次只发主分支的包。"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true"            >> "$GITHUB_OUTPUT"
          echo "branch=${branch}"      >> "$GITHUB_OUTPUT"
          echo "使用升级分支 ${branch}。"

      # 升级分支的真编译在 upstream-check 里已经做过，这里只回检跨文件一致性，
      # 防止分支推出后主分支又改了映射导致两边对不上。
      - name: 回检升级分支
        if: steps.auto.outputs.found == 'true'
        env:
          BRANCH: ${{ steps.auto.outputs.branch }}
        run: |
          set -e
          git worktree add --detach /tmp/autotree "origin/${BRANCH}"
          cd /tmp/autotree
          bash t/consistency.sh
          bash t/test_profile.sh
          echo "升级分支组件版本："
          bash t/product_version.sh

      - name: 打包
        env:
          BASE_PKG: ${{ steps.ver.outputs.base_pkg }}
          AUTO_PKG: ${{ steps.ver.outputs.auto_pkg }}
          FOUND: ${{ steps.auto.outputs.found }}
        run: |
          set -e
          bash t/pack.sh . "${BASE_PKG}" dist
          if [ "${FOUND}" = 'true' ]; then
            bash t/pack.sh /tmp/autotree "${AUTO_PKG}" dist
          fi
          ls -l dist

      - name: 生成校验值
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 构建证明（GitHub 原生，无需管理密钥）
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      # GPG 签名为可选项；未配置 secret 时仍保留 GitHub 构建证明。
      - name: 检查是否配置了 GPG
        id: gpg
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 GPG_PRIVATE_KEY，跳过 GPG 签名（构建证明已生成，不影响发布）"
          fi

      - name: GPG 分离签名
        if: steps.gpg.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          printf '%s' "${KEY}" | gpg --batch --import
          cd dist
          for f in *.tar.gz SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${PASSPHRASE}" \
                --armor --detach-sign "$f"
          done
          ls -l

      - name: 生成发布说明
        id: notes
        env:
          PRODUCT: ${{ steps.ver.outputs.product }}
          STAMP: ${{ steps.ver.outputs.stamp }}
          REPO: ${{ github.repository }}
          LEVEL: ${{ inputs.level || 'full' }}
          # 升级分支的编译验证在上游版本检查里完成，固定 full。
          AUTO_LEVEL: full
          BASE_DIR: .
          BASE_PKG: ${{ steps.ver.outputs.base_pkg }}
          # 没有升级分支时这三项为空，说明里只描述主分支的包。
          AUTO_DIR: ${{ steps.auto.outputs.found == 'true' && '/tmp/autotree' || '' }}
          AUTO_PKG: ${{ steps.auto.outputs.found == 'true' && steps.ver.outputs.auto_pkg || '' }}
          AUTO_BRANCH: ${{ steps.auto.outputs.branch }}
        run: |
          set -e
          bash t/release_notes.sh > /tmp/notes.md
          cat /tmp/notes.md

      - name: 发布
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LNMP ${{ steps.ver.outputs.product }} (${{ steps.ver.outputs.stamp }})
          body_path: /tmp/notes.md
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.asc
          fail_on_unmatched_files: false
