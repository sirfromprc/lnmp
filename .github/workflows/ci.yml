# 推送 / PR 涉及脚本、配置或校验材料时的快速静态检查。
#
# 分工：
#   ci.yml          静态检查，几十秒，代码相关的推送才跑
#   build-test.yml  真编译，几十分钟，只在升级 PR 和发布前跑
#
# consistency 检查用于发现版本、映射和校验清单之间的跨文件不一致。

name: CI

# 仅文档、许可证或其它工作流变更时不触发；后出现的规则覆盖前面的规则。
on:
  push:
    branches: [ main, master ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!License'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!License'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  # release.yml 以此作为发布前的静态检查。
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 语法检查（bash -n）
        run: |
          set -e
          fail=0
          # 顶层脚本 + include/ + t/ + tools/ + init.d/ + 三个运维脚本
          while IFS= read -r f; do
            if ! bash -n "$f" 2>/tmp/err; then
              echo "::error file=$f::$(head -1 /tmp/err)"
              fail=1
            fi
          done < <(
            find . -path ./.git -prune -o \
                   \( -name '*.sh' -o -name 'lnmp' -o -name 'lnmpa' -o -name 'lamp' \) \
                   -type f -print
          )
          exit $fail

      # 检查范围与排除规则由 t/shellcheck.sh 统一维护，此处只负责装上 shellcheck。
      # 该脚本在未安装 shellcheck 时返回 2，CI 里必须先装。
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          bash t/shellcheck.sh

      - name: 不变式检查（t/lint.sh）
        run: bash t/lint.sh

      - name: 跨文件一致性（t/consistency.sh）
        run: bash t/consistency.sh

      - name: 编号映射自测（t/test_profile.sh）
        run: bash t/test_profile.sh

      - name: 派发自测（t/test_dispatch.sh）
        run: bash t/test_dispatch.sh

      # 验证自动升版脚本同步版本映射和校验清单。
      - name: 升版跨文件同步自测（t/test_bump.sh）
        run: bash t/test_bump.sh

      - name: 上游检查失败与候选包自测（t/test_upstream.sh）
        run: bash t/test_upstream.sh
