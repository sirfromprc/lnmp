# 每月 8 日检查上游版本，并为 AUTO 类更新创建 PR。
#
# 流程：
#   查上游 → 只应用 AUTO 类 → 重算受影响的 sha256 → 一致性回检
#   → 探测新 URL 是否可达 → 编译并验证 Lua 运行期 → 开 PR
#
# 任一步骤失败时不创建 PR，失败信息写入 Actions 摘要。
#
# 默认仅应用 AUTO。COUPLED 涉及配套运行时兼容，需手动触发并检查；
# MANUAL 涉及稳定分支或大版本切换，仅生成报告。

name: 上游版本检查

on:
  schedule:
    # UTC 每月 7 日 19:00 对应北京时间每月 8 日 03:00。
    - cron: '0 19 7 * *'
  workflow_dispatch:
    inputs:
      kinds:
        description: '要应用的类别'
        type: choice
        options: [AUTO, 'AUTO,COUPLED']
        default: AUTO
      dry_run:
        description: '只看报告，不开 PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    name: 检查并生成升级分支
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has_changes: ${{ steps.apply.outputs.has_changes }}
      branch: ${{ steps.apply.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查上游版本
        env:
          # GitHub API 匿名限额不足以完成本步骤，因此使用工作流 token。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash t/check_upstream.sh

      - name: 把报告贴到 Actions 摘要
        run: |
          {
            echo "## 上游版本检查（$(date -u '+%Y-%m-%d')）"
            echo
            cat .upstream/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 应用升级并重算校验值
        id: apply
        env:
          KINDS: ${{ inputs.kinds || 'AUTO' }}
        run: |
          set -e
          if [ ! -s .upstream/bumps.tsv ]; then
            echo "没有可升级的组件。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bash t/bump_version.sh --kinds "$KINDS"

          if [ ! -s .upstream/changed.tsv ]; then
            echo "本轮没有应用任何变更（可能全是 MANUAL）。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 版本号与校验值必须同步，否则安装会在完整性校验阶段中止。
          bash t/refresh_checksums.sh

          bash t/consistency.sh
          bash t/probe_urls.sh

          branch="auto/upstream-$(date -u '+%Y%m%d')"
          echo "has_changes=true"      >> "$GITHUB_OUTPUT"
          echo "branch=${branch}"      >> "$GITHUB_OUTPUT"

      - name: 暂存改动供后续 job 使用
        if: steps.apply.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bumped-tree
          path: |
            include/version.sh
            include/profile.sh
            src/checksums.sha256
            t/probe_urls.sh
            t/gen_checksums.sh
            t/test_profile.sh
            .upstream/report.md
          retention-days: 7
          include-hidden-files: true

  # Lua 版本断言在运行时触发，创建 PR 前必须完成编译和请求验证。
  verify:
    name: 真编译验证
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    uses: ./.github/workflows/build-test.yml
    with:
      level: quick
      # 待提交的升版结果来自 check job 上传的 artifact。
      artifact: bumped-tree

  pr:
    name: 开 PR
    needs: [check, verify]
    if: needs.check.outputs.has_changes == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bumped-tree
          path: .

      - name: 生成 PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ needs.check.outputs.branch }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: |
            chore(deps): 上游版本例行升级

            由 .github/workflows/upstream-check.yml 自动生成。
            已通过：校验值重算、跨文件一致性、URL 可达性、Lua 全家桶真编译。
          title: 'chore(deps): 上游版本例行升级'
          body-path: .upstream/report.md
          labels: dependencies, automated
          delete-branch: true
          add-paths: |
            include/version.sh
            include/profile.sh
            src/checksums.sha256
            t/probe_urls.sh
            t/gen_checksums.sh
            t/test_profile.sh

      - name: 提醒
        run: |
          {
            echo "### PR 已生成"
            echo
            echo "合并前请确认："
            echo "- [ ] 报告里 MANUAL 类的条目是否需要人工处理"
            echo "- [ ] 若本次含 COUPLED（Lua 全家桶），建议再手动跑一次"
            echo "      \`Build Test\` 的 full 模式"
          } >> "$GITHUB_STEP_SUMMARY"
