# 每月 8 日检查上游版本，把 AUTO 类更新推到 auto-<日期> 分支。
#
# 流程：
#   查上游 → 只应用 AUTO 类 → 重算受影响的 sha256 → 一致性回检
#   → 探测新 URL 是否可达 → 编译并验证 Lua 运行期 → 推分支 → 回收旧分支
#
# 任一步骤失败时不推分支，失败信息写入 Actions 摘要。
#
# 升级结果不合并回主分支：主分支的组件版本由维护者手工确认，
# 自动升级只活在 auto-<日期> 分支上，发布时两条线各出一个包。
# 分支每轮从触发时的主分支重建，因此始终等于「最新源码 + 最新组件版本」。
# 需要把升级结果并入主分支时，手动触发 sync-versions.yml。
#
# 默认仅应用 AUTO。COUPLED 涉及配套运行时兼容，需手动触发并检查；
# MANUAL 涉及稳定分支或大版本切换，仅生成报告。

name: 上游版本检查

on:
  schedule:
    # UTC 每月 7 日 19:00 对应北京时间每月 8 日 03:00。
    - cron: '0 19 7 * *'
  workflow_dispatch:
    inputs:
      kinds:
        description: '要应用的类别'
        type: choice
        options: [AUTO, 'AUTO,COUPLED']
        default: AUTO
      dry_run:
        description: '只看报告，不推分支'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    name: 检查并生成升级分支
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has_changes: ${{ steps.apply.outputs.has_changes }}
      branch: ${{ steps.apply.outputs.branch }}
    steps:
      - uses: actions/checkout@v5

      - name: 检查上游版本
        env:
          # GitHub API 匿名限额不足以完成本步骤，因此使用工作流 token。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash t/check_upstream.sh

      - name: 把报告贴到 Actions 摘要
        run: |
          {
            echo "## 上游版本检查（$(date -u '+%Y-%m-%d')）"
            echo
            cat .upstream/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 应用升级并重算校验值
        id: apply
        env:
          KINDS: ${{ inputs.kinds || 'AUTO' }}
        run: |
          set -e
          if [ ! -s .upstream/bumps.tsv ]; then
            echo "没有可升级的组件。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bash t/bump_version.sh --kinds "$KINDS"

          if [ ! -s .upstream/changed.tsv ]; then
            echo "本轮没有应用任何变更（可能全是 MANUAL）。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 版本号与校验值必须同步，否则安装会在完整性校验阶段中止。
          bash t/refresh_checksums.sh

          bash t/consistency.sh
          bash t/probe_urls.sh

          branch="auto-$(date -u '+%Y%m%d')"
          echo "has_changes=true"      >> "$GITHUB_OUTPUT"
          echo "branch=${branch}"      >> "$GITHUB_OUTPUT"

      - name: 暂存改动供后续 job 使用
        if: steps.apply.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: bumped-tree
          path: |
            include/version.sh
            include/profile.sh
            src/checksums.sha256
            t/probe_urls.sh
            t/gen_checksums.sh
            t/test_profile.sh
            .upstream/report.md
          retention-days: 7
          include-hidden-files: true

  # Lua 版本断言在运行时触发，推分支前必须完成编译和请求验证。
  # 升级结果会自动发布，因此正式路径跑 full；dry_run 只看报告，用 quick 省时间。
  verify:
    name: 真编译验证
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    uses: ./.github/workflows/build-test.yml
    with:
      level: ${{ inputs.dry_run && 'quick' || 'full' }}
      # 待提交的升版结果来自 check job 上传的 artifact。
      artifact: bumped-tree

  push:
    name: 推送升级分支
    needs: [check, verify]
    if: needs.check.outputs.has_changes == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 从触发时的主分支重建升级分支，保证它同时含最新源码与最新组件版本。
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: bumped-tree
          path: .

      - name: 提交并推送
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
          BASE: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -B "${BRANCH}"
          git add include/version.sh include/profile.sh src/checksums.sha256 \
                  t/probe_urls.sh t/gen_checksums.sh t/test_profile.sh

          if git diff --cached --quiet; then
            echo "升级结果与 ${BASE} 无差异，不推分支。"
            exit 0
          fi

          git commit -F - <<EOF
          chore(deps): 上游版本例行升级

          基线分支：${BASE}
          由 .github/workflows/upstream-check.yml 自动生成，不合并回 ${BASE}。
          已通过：校验值重算、跨文件一致性、URL 可达性、Lua 全家桶真编译。
          EOF

          # 同一天重跑时覆盖上一次的结果，分支内容始终是本轮的完整升级。
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "已推送 ${BRANCH}。"

      - name: 提醒
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          {
            echo "### 升级分支已推送：\`${BRANCH}\`"
            echo
            echo "该分支不会合并回主分支。接下来会自动发布 Release，"
            echo "从它打出带日期的包，主分支的包保持手工确认的组件版本。"
            echo
            echo "需要确认："
            echo "- [ ] 报告里 MANUAL 类的条目是否需要人工处理"
            echo "- [ ] 要把组件版本并入主分支时，手动触发 \`同步组件版本到主分支\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 升级分支已通过 full 编译，直接发布。dry_run 与无升级时不会走到这里。
  release:
    name: 发布
    needs: [check, verify, push]
    if: needs.check.outputs.has_changes == 'true' && !inputs.dry_run
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit

  # 升级分支不合并也就没有天然的回收时机，每轮跑完只留最新一个。
  # 排在发布之后，避免清理与发布查找升级分支同时进行。
  cleanup:
    name: 清理旧的升级分支
    needs: [check, push, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: 只保留最新一个升级分支
        # 默认 shell 不带 pipefail，管道会吞掉脚本返回码，此处显式指定。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          echo '### 升级分支清理'  >> "$GITHUB_STEP_SUMMARY"
          echo '```'               >> "$GITHUB_STEP_SUMMARY"
          set +e
          bash t/cleanup_branches.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          echo '```'               >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"
