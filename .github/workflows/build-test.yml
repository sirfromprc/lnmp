# 真编译验证。被 upstream-check.yml 和 release.yml 调用（workflow_call），
# 也可以手动触发。
#
# lua-resty-core 与 lua-nginx-module 的版本断言位于 base.lua，只在 Lua 运行时执行：
#
#     ./configure  通过
#     make         通过
#     nginx -t     通过
#     nginx 启动   通过
#     第一次访问带 Lua 的 location  → 500
#
# 因此 Lua 验证必须发送真实请求并比对响应体。
#
# 容器使用目标发行版 debian:12，避免 ubuntu-latest 的依赖差异掩盖构建问题。

name: Build Test

on:
  workflow_call:
    inputs:
      level:
        description: 'quick = 只验 Lua 全家桶；full = 再加 nginx 全模块与 PHP'
        type: string
        default: quick
      artifact:
        description: |
          可选。待验证改动所在的 artifact 名称，下载后覆盖 checkout 的内容。
          升版结果尚未提交时必须传入，否则编译的是当前提交的版本。
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      level:
        description: '验证深度'
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

jobs:
  lua:
    name: Lua 全家桶（编译 + 启动 + 真发请求）
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 45
    steps:
      - name: 装 git（容器基础镜像没有）
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v5

      - name: 覆盖为待验证的改动
        if: inputs.artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: .

      - name: 确认实际参与编译的版本号
        if: inputs.artifact != ''
        run: grep -E "^(Nginx_Ver|PHP_Ver|Lua)" include/version.sh || true

      - name: 编译前离线一致性检查
        run: bash t/consistency.sh

      - name: 编译并验证
        run: bash t/build_test.sh lua

      - name: 失败时打包日志
        if: failure()
        run: |
          mkdir -p /tmp/artifacts
          cp -a /usr/local/nginx-luatest/logs /tmp/artifacts/ 2>/dev/null || true
          cp -a /usr/local/nginx-luatest/conf/nginx.conf /tmp/artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: lua-build-logs
          path: /tmp/artifacts
          retention-days: 7

  nginx-full:
    name: nginx 全模块（含自建 OpenSSL 与 brotli）
    if: inputs.level == 'full'
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 90
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
      - name: 覆盖为待验证的改动
        if: inputs.artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: .
      - name: 编译并验证
        run: bash t/build_test.sh nginx

  php:
    name: PHP 默认分支编译
    if: inputs.level == 'full'
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 90
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
      - name: 覆盖为待验证的改动
        if: inputs.artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: .
      - name: 编译并验证
        run: bash t/build_test.sh php

  # 汇总节点为调用方提供单一 needs 结果，并兼容 quick 模式的 skipped 状态。
  result:
    name: 构建验证结论
    if: always()
    needs: [lua, nginx-full, php]
    runs-on: ubuntu-latest
    steps:
      - name: 判定
        run: |
          echo "lua        = ${{ needs.lua.result }}"
          echo "nginx-full = ${{ needs.nginx-full.result }}"
          echo "php        = ${{ needs.php.result }}"
          # skipped 是 quick 模式的正常结果，只有 failure / cancelled 才算失败
          for r in "${{ needs.lua.result }}" "${{ needs.nginx-full.result }}" "${{ needs.php.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::构建验证未通过"; exit 1 ;;
            esac
          done
          echo "构建验证通过"
