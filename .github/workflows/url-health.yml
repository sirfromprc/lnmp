# 下载 URL 存活探测。
#
# upstream-check 每月检查新版本；url-health 每周确认当前固定版本仍可下载。
# nginx.org 和 cdn.mysql.com 可能下线旧版本，失效会阻断新安装并自动创建 issue。

name: 下载源存活探测

on:
  schedule:
    # 每周一 UTC 19:00 = 北京时间周二 03:00
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: 探测全部下载 URL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 探测
        id: probe
        run: |
          set +e
          bash t/probe_urls.sh 2>&1 | tee /tmp/probe.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 写摘要
        run: |
          {
            echo "## 下载源探测结果"
            echo
            echo '```'
            tail -40 /tmp/probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有失效链接就开 issue
        if: steps.probe.outputs.rc != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/probe.log', 'utf8');
            const failed = log.split('\n')
                              .filter(l => /FAIL|404/.test(l))
                              .slice(0, 40).join('\n');
            const title = '下载源失效：部分组件已无法下载';

            // 同名 issue 存在时追加评论，避免重复创建。
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'url-health'
            });

            const body = [
              `探测时间：${new Date().toISOString()}`,
              '',
              '失效条目：',
              '```',
              failed || '(见 Actions 日志)',
              '```',
              '',
              '**影响**：所有新安装会在下载这一步中止。',
              '',
              '**通常原因**：上游只保留最新的几个点版本，我们钉着的版本被下线了。',
              '**处理**：手动触发 `上游版本检查` 工作流，把版本推到上游还提供的那个，',
              '并确认 `src/checksums.sha256` 一并更新。',
            ].join('\n');

            // 仓库关闭 Issues 或收紧权限时 API 返回 403/410。
            // 此时不能静默吞掉探测结果，改为写进作业摘要并让作业失败。
            try {
              if (issues.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issues[0].number, body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['url-health', 'bug']
                });
              }
            } catch (e) {
              await core.summary
                .addHeading('下载源失效（issue 创建失败）', 2)
                .addRaw(`创建 issue 被拒绝：${e.status || ''} ${e.message}`)
                .addCodeBlock(body, 'text')
                .write();
              core.setFailed(`下载源失效，且无法创建 issue：${e.message}`);
            }
